name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull Docker image
        run: docker pull ${{ secrets.DOCKERHUB_USER }}/demo:latest

      - name: Stop existing container
        run: docker stop demo || true

      - name: Remove existing container
        run: docker rm demo || true

      - name: Run new container
        run: docker run --name demo -d -p 8080:8080 ${{ secrets.DOCKERHUB_USER }}/demo:latest
